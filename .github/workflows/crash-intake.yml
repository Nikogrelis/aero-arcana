name: crash-intake
# Turns launcher crash reports (published to a private ntfy.sh topic) into GitHub issues.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency: crash-intake
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/crash_intake.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
