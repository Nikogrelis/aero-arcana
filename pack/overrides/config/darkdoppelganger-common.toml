#Dark Doppelganger Configuration
[dark_doppelganger]
	#Health of the Dark Doppelganger. It refills at the start of phases 2 and 3, so the full fight is roughly 2.4x this value.
	#Minecraft caps max health at 1024; above that the boss takes proportionally less damage instead, so the fight still lasts as long as this value.
	# Default: 1500.0
	# Range: 1.0 ~ 100000.0
	health = 1500.0
	#Attack Damage of the Dark Doppelganger
	# Default: 10.0
	# Range: 0.1 ~ 1000.0
	attack_damage = 10.0
	#Movement Speed of the Dark Doppelganger
	# Default: 0.2
	# Range: 0.01 ~ 2.0
	movement_speed = 0.2
	#Knockback Resistance of the Dark Doppelganger
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	knockback_resistance = 0.6
	#Armor of the Dark Doppelganger
	# Default: 10.0
	# Range: 0.0 ~ 100.0
	armor = 10.0
	#Follow Range of the Dark Doppelganger
	# Default: 64.0
	# Range: 1.0 ~ 256.0
	follow_range = 64.0
	#Hard mode of the Dark Doppelganger
	hard_mode = false
	#If true, the boss will copy the player's armor unless the armor is banned or missing. If false, the boss will always use the configured default armor set.
	copy_player_armor = true
	#If true, the boss will copy the player's main hand item. If false, it will always use the configured default main hand item.
	copy_player_mainhand = true
	#Damage multiplier for arrows the boss fires when it holds a bow or crossbow. A fully drawn shot at 1.0 deals about as much as a player's fully drawn bow.
	# Default: 2.0
	# Range: 0.0 ~ 100.0
	bow_damage_multiplier = 2.0
	#Extra health per additional player within 48 blocks when the boss is summoned, as a fraction of base health. 0.5 = +50% per extra player. 0 disables scaling.
	# Default: 0.5
	# Range: 0.0 ~ 10.0
	health_per_extra_player = 0.5
	#Cap on each spell power attribute the boss copies from the summoner (before doppelgangerSpellPowerMultiplier).
	#Global and school spell power multiply together, so 1.3 allows up to about 1.7x spell damage.
	#Stops high spell power mage builds from facing a boss that one-shots them. 0 disables the cap.
	# Default: 1.3
	# Range: 0.0 ~ 100.0
	max_copied_spell_power = 1.3
	#Default weapon item ID used when the boss should not copy the player's main hand item.
	default_mainhand = "minecraft:netherite_sword"
	#Default helmet item ID used when the boss should not copy the player's helmet.
	default_helmet = "irons_spellbooks:netherite_mage_helmet"
	#Default chestplate item ID used when the boss should not copy the player's chestplate.
	default_chestplate = "irons_spellbooks:netherite_mage_chestplate"
	#Default leggings item ID used when the boss should not copy the player's leggings.
	default_leggings = "irons_spellbooks:netherite_mage_leggings"
	#Default boots item ID used when the boss should not copy the player's boots.
	default_boots = "irons_spellbooks:netherite_mage_boots"
	#Armor item IDs the boss is NOT allowed to copy from the player. Supports wildcard with * suffix.
	#Examples:
	#minecraft:netherite_helmet
	#irons_spellbooks:*
	banned_armor = ["minecraft:netherite_helmet"]
	#Play a short cutscene when the boss is summoned. Players within 48 blocks watch it rise from its portal.
	introCutscene = true
	#Scales all Iron's Spellbooks spell power attributes copied from the summoner. 1.0 = no change.
	# Default: 1.0
	# Range: 0.0 ~ 100.0
	doppelgangerSpellPowerMultiplier = 1.0

	[dark_doppelganger.phase1]
		spells_a = ["irons_spellbooks:magic_missile", "irons_spellbooks:magic_missile", "irons_spellbooks:firebolt", "irons_spellbooks:icicle", "irons_spellbooks:blood_slash", "irons_spellbooks:fang_strike"]
		spells_b = ["irons_spellbooks:fang_ward", "irons_spellbooks:gust", "irons_spellbooks:blood_step"]
		spells_c = ["irons_spellbooks:blood_step", "irons_spellbooks:burning_dash"]
		spells_d = ["irons_spellbooks:blight", "irons_spellbooks:haste"]

	[dark_doppelganger.phase2]
		spells_a = ["irons_spellbooks:ice_spikes", "irons_spellbooks:ice_spikes", "irons_spellbooks:icicle", "irons_spellbooks:chain_lightning", "irons_spellbooks:ball_lightning", "irons_spellbooks:lightning_lance"]
		spells_b = ["irons_spellbooks:frostwave", "irons_spellbooks:shockwave", "irons_spellbooks:frost_step"]
		spells_c = ["irons_spellbooks:frost_step", "irons_spellbooks:volt_strike"]
		spells_d = ["irons_spellbooks:echoing_strikes", "irons_spellbooks:charge"]

	[dark_doppelganger.phase3]
		spells_a = ["irons_spellbooks:eldritch_blast", "irons_spellbooks:wither_skull", "irons_spellbooks:wither_skull", "irons_spellbooks:lightning_lance", "irons_spellbooks:fang_strike", "irons_spellbooks:magic_arrow"]
		spells_b = ["irons_spellbooks:shockwave", "irons_spellbooks:fang_ward", "irons_spellbooks:blood_step"]
		spells_c = ["irons_spellbooks:blood_step", "irons_spellbooks:ascension"]
		spells_d = ["irons_spellbooks:echoing_strikes", "irons_spellbooks:thunderstorm"]

	[dark_doppelganger.final]
		spells_a = ["irons_spellbooks:sonic_boom", "irons_spellbooks:eldritch_blast", "irons_spellbooks:wither_skull", "irons_spellbooks:lightning_lance", "irons_spellbooks:ice_spikes", "irons_spellbooks:fang_strike"]
		spells_b = ["irons_spellbooks:shockwave", "irons_spellbooks:frostwave", "irons_spellbooks:blood_step"]
		spells_c = ["irons_spellbooks:blood_step", "irons_spellbooks:volt_strike", "irons_spellbooks:ascension"]
		spells_d = ["irons_spellbooks:echoing_strikes", "irons_spellbooks:thunderstorm", "irons_spellbooks:haste"]

#Summoning Configuration
[summoning]
	#When true, the Shadow Altar can only summon the Dark Doppelganger in The End
	altar_end_only = true

#Minion Configuration
[minion]
	#Base max health for minions
	# Default: 40.0
	# Range: 1.0 ~ 1000.0
	health = 40.0
	#Base attack damage for minions
	# Default: 6.0
	# Range: 0.1 ~ 100.0
	attack_damage = 6.0
	#Base movement speed for minions
	# Default: 0.28
	# Range: 0.01 ~ 2.0
	movement_speed = 0.28
	#Base armor for minions
	# Default: 4.0
	# Range: 0.0 ~ 100.0
	armor = 4.0
	#Spell used for the minion barrage goal. Must be a valid spell id.
	#Example: irons_spellbooks:devour
	barrage_spell = "irons_spellbooks:devour"
	#List of spells minions can randomly use in their attack goal.
	#Invalid ids are ignored.
	spells = ["irons_spellbooks:guiding_bolt", "irons_spellbooks:blood_needles", "irons_spellbooks:blood_slash", "irons_spellbooks:fang_ward", "irons_spellbooks:gust", "irons_spellbooks:burning_dash", "irons_spellbooks:blight", "irons_spellbooks:invisibility"]
